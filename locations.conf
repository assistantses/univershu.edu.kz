# Общие location-блоки, подключаются во все server { } через include —
# чтобы не дублировать их в HTTP- и HTTPS-блоках nginx.conf.

# Backend API — проксируется на сервис "backend" внутри Docker-сети,
# так что браузер всегда обращается к одному origin (CORS не нужен).
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA fallback — клиентские маршруты (/about, /page/:key и т.д.) отдают index.html
location / {
    try_files $uri $uri/ /index.html;
}
