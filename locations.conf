# Общие location-блоки, подключаются во все server { } через include —
# чтобы не дублировать их в HTTP- и HTTPS-блоках nginx.conf.

# Backend API — проксируется на сервис "backend" внутри Docker-сети,
# так что браузер всегда обращается к одному origin (CORS не нужен).
# ^~ — чтобы /api/ никогда не перехватывался regexp-блоком статики ниже.
location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Страницы транскрипта — векторные SVG на несколько мегабайт; в сжатом виде
# они едут в 3-4 раза легче, поэтому для них (и для остальной текстовой
# статики) включаем gzip — в базовом образе nginx он выключен.
gzip on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types image/svg+xml application/javascript text/css application/json;

# Статика (картинки, SVG, PDF, шрифты, бандлы) — если файла нет, отдаём 404.
# Иначе её подхватывает SPA-fallback ниже и на запрос картинки приходит
# index.html со статусом 200: <img> показывает «битую» картинку, а в логах
# при этом всё выглядит успешным. Так однажды потерялись страницы транскрипта.
location ~* \.(svg|pdf|png|jpe?g|gif|webp|ico|css|js|map|woff2?|ttf|eot|txt|xml|webmanifest)$ {
    try_files $uri =404;
}

# SPA fallback — клиентские маршруты (/about, /page/:key и т.д.) отдают index.html
location / {
    try_files $uri $uri/ /index.html;
}
