# 1) Домены по HTTP — редирект на HTTPS.
server {
    listen 80;
    server_name shymkentuniversity.com www.shymkentuniversity.com shymkentuniversity.kz www.shymkentuniversity.kz;
    return 301 https://$host$request_uri;
}

# 2) Всё остальное по HTTP (например, прямой IP-адрес сервера) — отдаём сайт как есть.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/locations.conf;
}

# 3) Домены по HTTPS.
server {
    listen 443 ssl;
    server_name shymkentuniversity.com www.shymkentuniversity.com shymkentuniversity.kz www.shymkentuniversity.kz;

    ssl_certificate /etc/letsencrypt/live/shymkentuniversity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shymkentuniversity.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/locations.conf;
}
